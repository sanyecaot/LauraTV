name: Upload Files
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload all repo files
        uses: actions/upload-artifact@v4
        with:
          name: all-files
          path: ./
